# GraphHopper 11.0。GitHub Actions ランナー（import）・Mac（import + serve）・VPS（serve）で共用。
# 詳細: docs/requirements/infrastructure.md「GraphHopper 設定」
x-common: &gh-common
  image: israelhikingmap/graphhopper:11.0
  volumes:
    - ./data:/data
    - ./graphhopper/config.yml:/graphhopper/config.yml:ro
    - ./graphhopper/custom_models:/graphhopper/custom_models:ro

services:
  # graph-cache + CH を作る。十数分。Deploy graph workflow（make import）と、必要なら Mac で動かす。
  #   docker compose --profile import run --rm import
  import:
    <<: *gh-common
    profiles: [import]
    command: -c /graphhopper/config.yml --import -i /data/kanto-koshinetsu.osm.pbf -o /data/graph-cache
    environment:
      JAVA_OPTS: -Xmx4g -Xms4g

  # Mac 開発・VPS 共通。graph-cache を mmap で読む。
  #   docker compose up -d serve
  serve:
    <<: *gh-common
    command: ["-c", "/graphhopper/config.yml", "-o", "/data/graph-cache"]
    environment:
      # MMAP_STORE: graph-cache をヒープ外（OS ページキャッシュ）に置く
      JAVA_OPTS: -Xmx1g -Xms1g -Ddw.graphhopper.graph.dataaccess.default_type=MMAP_STORE
    mem_limit: 1.5g
    ports:
      - "127.0.0.1:8989:8989" # 127.0.0.1 必須。省略すると iptables を貫通して全開
    restart: unless-stopped
