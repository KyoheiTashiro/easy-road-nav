<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>easy-road-nav</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- iOS standalone: ステータスバーを透明にして地図を下に回り込ませる。UI は env(safe-area-inset-top) で避ける -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      /* 起動 splash: JS 到着まで #root 内の静的 HTML を表示。React の render が上書きして消える。
         背景は manifest の background_color と同じにし、Android のネイティブ splash から途切れず繋ぐ */
      #root:has(> .splash) {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 16px;
        background: #1a73e8;
        color: #fff;
        font:
          500 18px system-ui,
          sans-serif;
      }
      /* 速い読み込みでアイコン・文字がチラ見えしないよう、中身だけ 1 秒遅らせる（青地は即時） */
      .splash {
        opacity: 0;
        animation: splash-in 0s 1s forwards;
      }
      @keyframes splash-in {
        to {
          opacity: 1;
        }
      }
      .splash img {
        width: 96px;
        height: 96px;
        border-radius: 22px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash">
        <img src="/icon.png" alt="" />
        easy-road-nav
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
